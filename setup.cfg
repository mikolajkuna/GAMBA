# =====================================================
# Flake8 – linters / style check
# =====================================================
[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info
# tylko nasze moduły
include =
    src/*
    tests/*

# =====================================================
# Pytest – test runner
# =====================================================
[tool:pytest]
addopts = --maxfail=1 --disable-warnings -q
testpaths =
    tests

# =====================================================
# Coverage (opcjonalnie, jeśli chcesz pomiar)
# =====================================================
[coverage:run]
branch = True
source = src

[coverage:report]
show_missing = True
skip_covered = True
